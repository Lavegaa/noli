<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="사진 한 장으로 만드는 손맛 클릭커">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="clicker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clicker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF5A36">
  <link rel="manifest" href="manifest.json">

  <!--
    clickerSfx: WebAudio synth for click sounds (no audio assets).
    Classic script so it exists before Flutter starts.
  -->
  <script>
  (function () {
    'use strict';
    var ctx = null, master = null, noiseBuf = null, voices = 0;
    var MAX_VOICES = 24;

    function ensure() {
      if (ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC({ latencyHint: 'interactive' });
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6;
      comp.attack.value = 0.002; comp.release.value = 0.12;
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(comp); comp.connect(ctx.destination);
      var len = Math.floor(ctx.sampleRate * 0.25);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return ctx;
    }

    function unlock() {
      var c = ensure();
      if (c && c.state !== 'running') { c.resume().catch(function () {}); }
    }
    // Belt and braces: browsers grant audio on these gestures (pointerdown
    // from touch does NOT count as user activation in Chrome).
    ['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'].forEach(function (t) {
      window.addEventListener(t, unlock, { capture: true, passive: true });
    });

    function ready() {
      var c = ensure();
      if (!c) return null;
      if (c.state !== 'running') { c.resume().catch(function () {}); }
      if (voices >= MAX_VOICES) return null;
      return c;
    }

    function track(node, endTime) {
      voices++;
      node.onended = function () { voices = Math.max(0, voices - 1); };
      node.stop(endTime);
    }

    function env(c, peak, attack, decay) {
      var g = c.createGain(), t = c.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
      g.connect(master);
      return g;
    }

    function noise(c, filterType, freq, q, peak, decay, dest) {
      var src = c.createBufferSource();
      src.buffer = noiseBuf;
      src.playbackRate.value = 0.9 + Math.random() * 0.2;
      var f = c.createBiquadFilter();
      f.type = filterType; f.frequency.value = freq; f.Q.value = q;
      var g = dest || env(c, peak, 0.001, decay);
      src.connect(f); f.connect(g);
      src.start();
      track(src, c.currentTime + decay + 0.03);
    }

    function tone(c, type, f0, f1, peak, attack, decay, glide) {
      var o = c.createOscillator(), t = c.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + (glide || decay));
      o.connect(env(c, peak, attack, decay));
      o.start(t);
      track(o, t + attack + decay + 0.03);
      return o;
    }

    var switches = {
      clicky: function (c) {
        noise(c, 'highpass', 3200, 0.8, 0.9, 0.018);
        tone(c, 'square', 4200, 2600, 0.12, 0.001, 0.012);
        // tiny second click, like the click jacket snapping back
        setTimeout(function () { if (ctx) noise(ctx, 'highpass', 4500, 0.7, 0.35, 0.012); }, 14);
      },
      tactile: function (c) {
        noise(c, 'bandpass', 1400, 1.2, 0.9, 0.03);
        tone(c, 'sine', 300, 180, 0.25, 0.001, 0.04);
      },
      thock: function (c) {
        tone(c, 'sine', 170, 85, 0.85, 0.002, 0.11);
        noise(c, 'lowpass', 700, 0.9, 0.6, 0.05);
      }
    };

    function shift(f, semi) { return f * Math.pow(2, (semi || 0) / 12); }

    var effects = {
      pop: function (c, s) {
        tone(c, 'sine', shift(380, s), shift(980, s), 0.5, 0.002, 0.08, 0.05);
      },
      coin: function (c, s) {
        var t = c.currentTime;
        var o = c.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(shift(988, s), t);
        o.frequency.setValueAtTime(shift(1319, s), t + 0.06);
        var g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.004);
        g.gain.setValueAtTime(0.18, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        g.connect(master); o.connect(g);
        o.start(t); track(o, t + 0.3);
      },
      boing: function (c, s) {
        var t = c.currentTime;
        var o = tone(c, 'triangle', shift(160, s), shift(340, s), 0.5, 0.003, 0.3, 0.12);
        var lfo = c.createOscillator(), lg = c.createGain();
        lfo.frequency.value = 18; lg.gain.value = shift(28, s);
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.start(t); track(lfo, t + 0.33);
      }
    };

    window.clickerSfx = {
      unlock: unlock,
      playSwitch: function (name) {
        var c = ready(); var f = switches[name];
        if (c && f) { try { f(c); } catch (e) { console.warn(e); } }
      },
      playEffect: function (name, semitones) {
        var c = ready(); var f = effects[name];
        if (c && f) { try { f(c, semitones || 0); } catch (e) { console.warn(e); } }
      }
    };
  })();
  </script>

  <!--
    clickerSeg: background removal via @imgly/background-removal (AGPL),
    loaded lazily from jsDelivr on first use. The model (~80MB) is fetched
    from staticimgly.com on the first removal and then browser-cached.
  -->
  <script type="module">
    const IMGLY_URL = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';
    let modPromise = null;
    function load() {
      if (!modPromise) {
        modPromise = import(IMGLY_URL).catch((e) => {
          modPromise = null; // allow retry
          throw e;
        });
      }
      return modPromise;
    }

    function sniffType(b) {
      if (b.length > 3 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e) return 'image/png';
      if (b.length > 2 && b[0] === 0xff && b[1] === 0xd8) return 'image/jpeg';
      if (b.length > 11 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
      if (b.length > 2 && b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
      return 'application/octet-stream';
    }

    window.clickerSeg = {
      warmUp() { return load().then(() => true); },
      async remove(bytes, onProgress) {
        const report = (v) => { try { onProgress && onProgress(v); } catch (_) {} };
        const mod = await load();
        const removeBackground = mod.removeBackground || mod.default;
        // Aggregate per-asset progress into one monotonic 0..1 value:
        // downloads fill 0..0.9, inference the rest.
        const fetches = new Map();
        let best = 0;
        const emit = (v) => { if (v > best) { best = Math.min(1, v); report(best); } };
        const config = {
          output: { format: 'image/png', type: 'foreground' },
          progress: (key, cur, total) => {
            const ratio = total > 0 ? cur / total : 0;
            if (String(key).startsWith('fetch')) {
              fetches.set(key, [cur, total]);
              let c = 0, t = 0;
              for (const [a, b] of fetches.values()) { c += a; t += b; }
              emit(t > 0 ? 0.9 * (c / t) : 0);
            } else {
              emit(0.9 + 0.1 * ratio);
            }
          },
        };
        report(0);
        const blob = new Blob([bytes], { type: sniffType(bytes) });
        const out = await removeBackground(blob, config);
        report(1);
        return new Uint8Array(await out.arrayBuffer());
      },
    };
    // Prefetch the JS library (not the model) once the app is idle.
    setTimeout(() => load().catch((e) => console.warn('imgly prefetch failed', e)), 4000);
  </script>
</head>
<body>

</body>
</html>
